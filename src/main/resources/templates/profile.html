<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Profile</title>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f7;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .profile-top {
            text-align: center;
        }

        .profile-icon {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            color: white;
            font-size: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
        }

        h2 {
            margin: 10px 0;
        }

        .section {
            margin-top: 30px;
        }

        .section h3 {
            margin-bottom: 10px;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        .row {
            display: flex;
            gap: 20px;
            margin-top: 10px;
        }

        .input-box {
            flex: 1;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 10px;
            border: none;
            background: #f1f2f6;
        }

        .btn {
            margin-top: 20px;
            padding: 12px;
            width: 100%;
            border: none;
            border-radius: 10px;
            background: linear-gradient(to right, #4f46e5, #3b82f6);
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<!-- ✅ SUCCESS MESSAGE FIX -->
<p style="color:green;" th:text="${success}"></p>

<div class="container">

    <!-- TOP -->
    <div class="profile-top">
        <div class="profile-icon">👤</div>

        <h2 th:text="${user.username}"></h2>
        <p>Parent Account</p>
    </div>

    <!-- ✅ IMPORTANT: MATCH CONTROLLER URL -->
    <form th:action="@{/profile/save}" th:object="${user}" method="post">

        <!-- ✅ VERY IMPORTANT FOR UPDATE -->
        <input type="hidden" th:field="*{id}" />

        <!-- CONTACT -->
        <div class="section">
            <h3>Contact Information</h3>

            <div class="row">
                <div class="input-box">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" placeholder="Enter email">
                </div>

                <div class="input-box">
                    <label>Phone</label>
                    <input type="text" th:field="*{phone}" placeholder="Enter phone">
                </div>
            </div>
        </div>

        <!-- LOCATION -->
        <div class="section">
            <h3>Location</h3>

            <div class="input-box">
                <label>Address</label>
                <input type="text" th:field="*{address}" placeholder="Enter address">
            </div>
        </div>

        <!-- CHILD -->
        <div class="section">
            <h3>Child Information</h3>

            <div class="row">
                <div class="input-box">
                    <label>Child Name</label>
                    <input type="text" th:field="*{childName}">
                </div>

                <div class="input-box">
                    <label>Age</label>
                    <input type="number" th:field="*{age}">
                </div>
            </div>
        </div>

        <button class="btn">Save Profile</button>

    </form>

</div>

</body>
</html>
