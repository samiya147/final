<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Child Tracker Dashboard</title>

    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>

    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', sans-serif;
            background: #eef2f7;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 18px 30px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .left-section {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            width: 50px;
            height: 50px;
            border-radius: 15px;
            background: linear-gradient(135deg, #4f46e5, #3b82f6);
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 22px;
        }

        .welcome-text {
            font-size: 22px;
            font-weight: 700;
            color: #2d2d2d;
        }

        .nav-links a {
            margin: 0 18px;
            text-decoration: none;
            color: #333;
            font-weight: 500;
            font-size: 16px;
        }

        .logout {
            color: red;
            font-weight: bold;
            text-decoration: none;
        }

        .cards {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        .card {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            text-align: center;
        }

        .main {
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        #map {
            width: 70%;
            height: 400px;
            border-radius: 15px;
        }

        .side-box {
            width: 30%;
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .zone-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 18px;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>

<body>

<!-- NAVBAR -->
<div class="navbar">

    <div class="left-section">
        <div class="logo">🛡️</div>
        <div class="welcome-text">
            Welcome <span th:text="${user.username}"></span>
        </div>
    </div>

    <!-- ✅ FIXED HERE -->
    <div class="nav-links">
        <a href="/trackerdash">Dashboard</a>
        <a href="/profile">Profile</a>
        <a href="/zones">Zones</a> <!-- ✅ FIXED -->
    </div>

    <div>
        <a href="/logout" class="logout">Logout</a>
    </div>

</div>

<!-- CARDS -->
<div class="cards">

    <div class="card">
        <h3>Safe Zone</h3>
        <p id="safeStatus">Checking...</p>

        <!-- ✅ ADDED BUTTON -->
        <a href="/zones" class="zone-btn">Manage Safe Zones</a>
    </div>

    <div class="card">
        <h3>Child Status</h3>
        <p>Active</p>
    </div>

    <div class="card">
        <h3>GPS Signal</h3>
        <p>Strong</p>
    </div>

</div>

<!-- MAP -->
<div class="main">

    <div id="map"></div>

    <div class="side-box">
        <h3>Live Location</h3>
        <p>Latitude: <span id="lat"></span></p>
        <p>Longitude: <span id="lng"></span></p>
    </div>

</div>

<script>

    var map = L.map('map').setView([19.2183, 72.9781], 13);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png')
        .addTo(map);

    var marker = L.marker([19.2183, 72.9781]).addTo(map);

    function updateLocation() {

    fetch('/tracker/location')
        .then(response => response.json())
        .then(data => {

            var lat = data.lat;
            var lng = data.lng;

            document.getElementById("lat").innerText = lat;
            document.getElementById("lng").innerText = lng;

            marker.setLatLng([lat, lng]);
            map.setView([lat, lng]);

            document.getElementById("safeStatus").innerText = "Yes";
        })
        .catch(error => {
            console.error("Error fetching location:", error);
        });
}

setInterval(updateLocation, 3000);

</script>

</body>
</html>
